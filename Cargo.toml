[package]
name = "protos"
version = "0.24.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LiGoldragon/protos"
description = "Universal structural substrate for the Protos family."
publish = false

[lib]
name = "protos"
path = "src/lib.rs"

[dev-dependencies]
proptest = "1.6"

[lints.rust]
unsafe_code = "forbid"
unused = { level = "warn", priority = -1 }
dead_code = "warn"

[[test]]
name = "scale"
harness = false
