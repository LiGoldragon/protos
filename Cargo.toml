[package]
name         = "protos"
version      = "0.1.0"
edition      = "2024"
rust-version = "1.85"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/protos"
description  = "Implementation-free component contracts for the Protos family."
publish      = false

[lib]
name = "protos"
path = "src/lib.rs"

[dependencies]
content-identity = { git = "https://github.com/LiGoldragon/content-identity.git", rev = "24b43bae5d9748b0e7f679c6ec9f85a643c4d36a" }
name-table       = { git = "https://github.com/LiGoldragon/name-table.git", rev = "196610e2907687dcb8dbd0d2dfaafe4aefd9fa27" }
signal-frame     = { git = "https://github.com/LiGoldragon/signal-frame.git", rev = "0786fbe8caf27552afcdd5deb85bc82ec6088337" }
structural-codec = { git = "https://github.com/LiGoldragon/structural-codec.git", rev = "100e69bcf6430b88ed6a22bb5132bdc2af91546b" }

[dev-dependencies]
raw-discovery = { git = "https://github.com/LiGoldragon/raw-discovery.git", rev = "01b21b94460ba99f4ffbab4d4d4c86661a040208" }

[lints.rust]
unsafe_code = "forbid"
unused      = { level = "warn", priority = -1 }
dead_code   = "warn"
